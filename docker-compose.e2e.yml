# E2E 专用覆盖文件,配合独立项目名使用(独立卷,不碰日常数据):
#   export E2E_INVITE_CODE=<随机值>
#   export E2E_ADMIN_PASSWORD=<随机值,≥ 12 位>   # 可选:启用管理端,web/e2e/admin-v2.spec.ts 需要;不设则该用例跳过
#   docker compose -p enjoy-e2e -f docker-compose.example.yml -f docker-compose.e2e.yml up -d --build --wait
services:
  server:
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      REGISTRATION_MODE: invite
      INVITE_CODE: ${E2E_INVITE_CODE:?set E2E_INVITE_CODE}
      RATE_LIMIT_PER_MINUTE: "1000"
      UPSTREAM_ASR_MODE: ${E2E_UPSTREAM_ASR_MODE:-chat}
      RANK_ENABLED: "true"
      ROOMS_ENABLED: "true"
      ROOMS_AI_GLOBAL_DAILY: "0"   # E2E 不调用房间 AI(零成本);AI 路径由 server/tests/test_rooms_ws.py 覆盖
      ROOMS_VOICE_ENABLED: "true"  # rooms-v2.spec.ts 需要语音入口;上传被 page.route 拦截成契约样例,不产生上游调用
      WORDBOOK_ENABLED: "true"     # wordbook.spec.ts;只读本地词典文件与数据库。AI 讲解(WORDBOOK_AI_ENABLED)保持关闭,零上游
      WORDBOOK_SPOT_CHECK_PCT: "100"  # wordbook-recall.spec.ts:每个「认识」都抽查(断言确定);其他背单词规格按「模糊」学词,不受影响
      LINKS_ENABLED: "true"        # links.spec.ts;六个联动默认全开。对话用词的大模型检查(LINK_CHAT_WORDS_LLM_ENABLED)保持关闭,零上游
      ADMIN_USERNAME: ${E2E_ADMIN_USERNAME:-root}
      ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}   # 空 = 管理端关闭
      ADMIN_COOKIE_SECURE: "false"   # E2E 栈是 http://localhost:8100
    ports: !override
      - "127.0.0.1:8100:8000"
