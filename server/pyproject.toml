[project]
name = "enjoy-server"
version = "0.1.0"
description = "Self-hosted backend for the Enjoy desktop app"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "websockets>=13",
  "cryptography>=43",
  "lameenc>=1.7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# a test still running after 10 minutes dumps every thread's stack (it is not killed): a hang leaves evidence
faulthandler_timeout = 600
