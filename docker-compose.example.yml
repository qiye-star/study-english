# 示例 compose 文件。真正使用的 docker-compose.yml 不进 git(已在 .gitignore),
# 每个部署环境各自维护:
#   cp docker-compose.example.yml docker-compose.yml
# 然后按需修改(端口、网络、卷)。数据库与密钥等配置在 server/.env(同样不进 git)。
#
# 部署在 1Panel 上、需要访问 1Panel 的 PostgreSQL/OpenResty 容器时:
#   1) 取消下面 server 服务里 `networks:` 与文件末尾顶层 `networks:` 两段的注释;
#   2) server/.env 里 DATABASE_URL 的主机名写 PostgreSQL 容器的真实名字(docker ps 可查);
#   3) 1Panel 反向代理目标写 http://<server 容器名>:8000(例如 everyone-can-use-english-server-1)。
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: ./server/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - enjoy-data:/data
      # 跟读库 · 链接导入(可选,默认不需要;spec 2026-10-13-video-import §7.3):给 yt-dlp 用的 cookies 文件
      # (Netscape 格式,从浏览器导出)。它含账号会话,等同密钥:只用专门的小号,主账号有被平台限制的风险。
      # 宿主机上:chown 10001 ./secrets/ytdlp-cookies.txt && chmod 600 ./secrets/ytdlp-cookies.txt(容器用户 uid 10001)
      # 然后在 server/.env 写 LIBRARY_YTDLP_COOKIES_FILE=/run/secrets/ytdlp-cookies.txt;服务端每次取回复制一份副本用完即删,
      # 原文件只读。被拦时最稳的办法仍是在本机下载后「上传文件」。
      # - ./secrets/ytdlp-cookies.txt:/run/secrets/ytdlp-cookies.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:  # plan L1 Task 24: only when the `minio` profile is up; absent otherwise
        condition: service_completed_successfully
        required: false
    restart: unless-stopped
    # 1Panel:取消注释以加入 1Panel 的 Docker 网络(见文件头说明)
    # networks:
    #   - default
    #   - 1panel-network

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    # 不要把 server/.env(含上游密钥)传给数据库容器;POSTGRES_* 由 compose 自己的
    # 项目环境(根目录 .env 或 shell 环境变量)提供。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enjoy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-enjoy}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 对象存储(可选,spec 2026-10-21 §1、plan L1 Task 24):开发环境的 MinIO。只绑本机;没有密码默认值以外的凭据时
  # 请改 MINIO_ROOT_PASSWORD;服务端应使用专用钥匙而不是 root,例如在 MinIO 控制台建一把只读写本桶的钥匙。
  # 启用:docker compose --profile minio up -d;server/.env 里 STORAGE_BACKEND=s3、S3_ENDPOINT=http://minio:9000、
  # S3_PATH_STYLE=true、S3_BUCKET=enjoy、S3_ACCESS_KEY / S3_SECRET_KEY(专用钥匙)。桶保持私有(不设匿名策略)。
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z  # 未验证:实现时未拉取镜像;切换前请核对官方发布状态
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enjoy-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # 建桶(幂等):等 MinIO 就绪后创建私有桶;不设匿名访问策略。
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z  # 未验证:同上
    profiles: ["minio"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enjoy-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      S3_BUCKET: ${S3_BUCKET:-enjoy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done &&
        mc mb --ignore-existing "local/$$S3_BUCKET"

# 1Panel:取消注释(该网络由 1Panel 创建;没有时先 docker network create 1panel-network)
# networks:
#   1panel-network:
#     external: true

volumes:
  enjoy-data:
  pg-data:
  minio-data:
