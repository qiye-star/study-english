# 示例 compose 文件。真正使用的 docker-compose.yml 不进 git(已在 .gitignore),
# 每个部署环境各自维护:
#   cp docker-compose.example.yml docker-compose.yml
# 然后按需修改(端口、网络、卷)。数据库与密钥等配置在 server/.env(同样不进 git)。
#
# 部署在 1Panel 上、需要访问 1Panel 的 PostgreSQL/OpenResty 容器时:
#   1) 取消下面 server 服务里 `networks:` 与文件末尾顶层 `networks:` 两段的注释;
#   2) server/.env 里 DATABASE_URL 的主机名写 PostgreSQL 容器的真实名字(docker ps 可查);
#   3) 1Panel 反向代理目标写 http://<server 容器名>:8000(例如 everyone-can-use-english-server-1)。
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: ./server/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - enjoy-data:/data
      # 跟读库 · 链接导入(可选,默认不需要;spec 2026-10-13-video-import §7.3):给 yt-dlp 用的 cookies 文件
      # (Netscape 格式,从浏览器导出)。它含账号会话,等同密钥:只用专门的小号,主账号有被平台限制的风险。
      # 宿主机上:chown 10001 ./secrets/ytdlp-cookies.txt && chmod 600 ./secrets/ytdlp-cookies.txt(容器用户 uid 10001)
      # 然后在 server/.env 写 LIBRARY_YTDLP_COOKIES_FILE=/run/secrets/ytdlp-cookies.txt;服务端每次取回复制一份副本用完即删,
      # 原文件只读。被拦时最稳的办法仍是在本机下载后「上传文件」。
      # - ./secrets/ytdlp-cookies.txt:/run/secrets/ytdlp-cookies.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    # 1Panel:取消注释以加入 1Panel 的 Docker 网络(见文件头说明)
    # networks:
    #   - default
    #   - 1panel-network

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    # 不要把 server/.env(含上游密钥)传给数据库容器;POSTGRES_* 由 compose 自己的
    # 项目环境(根目录 .env 或 shell 环境变量)提供。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enjoy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-enjoy}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

# 1Panel:取消注释(该网络由 1Panel 创建;没有时先 docker network create 1panel-network)
# networks:
#   1panel-network:
#     external: true

volumes:
  enjoy-data:
  pg-data:
