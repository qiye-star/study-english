services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: ./server/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - enjoy-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    # 不要把 server/.env(含上游密钥)传给数据库容器;POSTGRES_* 由 compose 自己的
    # 项目环境(根目录 .env 或 shell 环境变量)提供。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enjoy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-enjoy}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  enjoy-data:
  pg-data:
